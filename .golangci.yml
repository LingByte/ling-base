version: "2"

run:
  timeout: 10m
  go: "1.26"
  # go.work requires readonly (default); "mod" breaks workspace CI.

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - dupl
    - errorlint
    - copyloopvar
    - gocritic
    - nilerr
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      # Close()/Unlock() in defer routinely use blank identifiers.
      check-blank: false
    gocritic:
      enabled-tags:
        - performance
        - style
        - diagnostic
      disabled-checks:
        - hugeParam
        - rangeValCopy
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
        - name: var-naming
    dupl:
      threshold: 200
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocritic
          - gosec
          - prealloc
          - revive
      - path: _test\.go
        text: "this value of error is never used"
      - path: main\.go
        linters:
          - errcheck
      - path: ".*embed.*"
        linters:
          - unused
      - path: ".*generated.*"
        linters:
          - all
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
