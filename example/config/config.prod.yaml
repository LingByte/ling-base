# Production environment overrides
server:
  port: 80
  host: "0.0.0.0"
  shutdown_timeout: "30s"

redis:
  addr: ""  # set via REDIS_ADDR env var in production

search:
  index_path: "/var/lib/app-demo/search"  # disk-based index for prod
  batch_size: 500
  query_timeout: "10s"

rate_limit:
  rps: 1000
  max_conns: 10000

log:
  level: "warn"
