name: Release

on:
  push:
    tags:
      # Match all module tags: "common/stats/v0.1.0", "scheduler/v1.2.3", "v0.1.0"
      - '*/v*'
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract tag info
        id: info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Extract module path and version
          if echo "$TAG" | grep -q '/v'; then
            MODULE=$(echo "$TAG" | sed 's|/v[^/]*$||')
            VERSION=$(echo "$TAG" | sed 's|.*/v||')
          else
            MODULE="."
            VERSION=$(echo "$TAG" | sed 's|^v||')
          fi
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Module: $MODULE, Version: $VERSION"

      - name: Verify module builds
        working-directory: ${{ steps.info.outputs.module }}
        run: |
          echo "==> Building ${{ steps.info.outputs.module }}@v${{ steps.info.outputs.version }}"
          go build ./...

      - name: Run module tests
        working-directory: ${{ steps.info.outputs.module }}
        run: go test -count=1 -race -timeout 5m ./...

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          generate_release_notes: true
          body: |
            ## ${{ steps.info.outputs.module }} v${{ steps.info.outputs.version }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false

  # ──────────────────────────────────────────────
  # build-cli: 当 lingcli tag 时，构建带嵌入源码的二进制
  # ──────────────────────────────────────────────
  build-cli:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/lingcli/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Prepare embedded source
        run: make prepare-cli-embed

      - name: Build lingcli (linux)
        run: cd lingcli && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../bin/lingcli-linux-amd64 .

      - name: Build lingcli (darwin)
        run: cd lingcli && CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o ../bin/lingcli-darwin-amd64 .

      - name: Build lingcli (darwin arm64)
        run: cd lingcli && CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o ../bin/lingcli-darwin-arm64 .

      - name: Build lingcli (windows)
        run: cd lingcli && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o ../bin/lingcli-windows-amd64.exe .

      - name: Upload lingcli binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            bin/lingcli-linux-amd64
            bin/lingcli-darwin-amd64
            bin/lingcli-darwin-arm64
            bin/lingcli-windows-amd64.exe
